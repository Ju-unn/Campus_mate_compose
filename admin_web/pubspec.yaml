name: campus_mate_admin
description: "CampusMate 운영자용 관리 웹(Flutter 웹 전용). 앱(frontend/)과 따로 빌드하고 서로 import 하지 않는다."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

# 앱(frontend/pubspec.yaml)이 이미 쓰는 부품만, 같은 버전 범위로 쓴다(설계서 §5).
# 새 외부 부품은 사용자 승인 전에는 넣지 않는다.
dependencies:
  flutter:
    sdk: flutter
  # 해시 없는 주소(/reports/123)를 쓰려고 usePathUrlStrategy 를 부른다. Flutter SDK 안 패키지라 외부 부품이 아니다(대장 지시 10-18).
  flutter_web_plugins:
    sdk: flutter
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  http: ^1.2.2
  # pen 웹 시안(WOjcG · UUkLx)의 선 아이콘이 Lucide 다. 앱이 이미 쓰는 묶음이라 같은 범위로 쓴다(대장 지시 10-18).
  lucide_icons_flutter: ^3.1.20

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true

  # Pretendard 정적 3종 — 앱 frontend/assets/fonts/ 의 같은 파일 사본(orioncactus/pretendard v1.3.9, OFL 1.1).
  # 웹 토큰(lib/theme/admin_typography.dart)이 쓰는 굵기만 둔다. 500(Medium)은 쓰는 곳이 없어 뺐다.
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
