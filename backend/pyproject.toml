[project]
name = "campus-mate-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "google-cloud-vision>=3.9",
    # FastAPI 의 multipart 폼(학생증 사진 업로드)에 필요하다.
    "python-multipart>=0.0.9",
    # 조각 2: 아바타 생성(gpt-image-2.5-flare, 2026-10-14)·자기소개 AI 초안. max_retries=0 으로 호출한다(2026-09-20 사용자 결정).
    "openai>=1.50",
    # 아바타 작업 큐(Cloud Tasks)와 워커 인증이 직접 쓴다. google-cloud-vision 이 이미 끌고 오던 것을
    # **이름으로 적어 둘 뿐**이라 실제로 받아 오는 패키지는 바뀌지 않는다 — Vision 을 걷어내는 날
    # 조용히 사라지지 않게 하는 줄이다.
    "google-auth>=2.38",
    # 결제 전 유료 카드의 흐린 미리보기(원본 아바타 → 8×10 JPEG, cards/paid_preview). 보안 점검 #3(2026-10-12 사용자 승인).
    # 12.3 아래로 내리지 않는다 — 12.2.0 에 있던 CVE 13건이 12.3.0 에서 고쳐졌다(검토 OSV 확인).
    # manylinux 휠에 libjpeg 가 들어 있어 slim 이미지에 시스템 패키지를 더하지 않는다.
    "pillow>=12.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
