name: campus_mate
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.3

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  image_picker: ^1.2.3
  cached_network_image: ^4.0.0
  lucide_icons_flutter: ^3.1.20
  google_mlkit_face_detection: ^0.13.1
  flutter_image_compress: ^2.3.0
  http: ^1.2.2
  # 지인(연락처) 차단(조각 6, 2026-09-22 승인). 권한 요청까지 이 패키지 하나로 한다.
  flutter_contacts: ^2.5.0
  path_provider: ^2.1.4

  # 푸시 알림(조각 4). firebase_core 는 firebase_messaging 이 요구해서 함께 들어간다.
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.2
  # 사용 통계(Firebase Analytics, 2026-10-20 사용자 승인 "출시전으로 해 지금 넣어줘")와 오류 수집(Crashlytics, 같은 날 승인 "1번").
  # 셋 다 약관 동의 뒤에만 켠다(lib/core/analytics/). 사용자 식별값은 보내지 않는다.
  firebase_analytics: ^12.0.1
  firebase_crashlytics: ^5.0.1
  # 성능 측정(Firebase Performance Monitoring, 2026-10-20 승인 "성능측정도 넣어 지금"). 자동 수집(앱 시작 · 화면 렌더링)만 쓴다 —
  # 사용자 지정 추적(HttpMetric · Trace)은 만들지 않는다(요청 주소에 계정 번호가 섞일 수 있다). 최신 0.12 는 firebase_core 5 를 요구해 0.11 대를 쓴다.
  firebase_performance: ^0.11.6
  # 앱이 화면에 떠 있을 때 받은 푸시를 안드로이드 시스템 알림으로 띄운다(2026-10-13 승인). iOS 는 쓰지 않는다 —
  # iOS 는 FCM 의 포그라운드 표시 옵션이 띄운다(lib/core/push/foreground_push.dart).
  flutter_local_notifications: ^22.3.2
  share_plus: ^13.3.0
  url_launcher: ^6.3.2
  # 소셜 로그인(대장 지시문 07)과 nonce 해시
  crypto: ^3.0.6
  google_sign_in: ^7.2.0
  kakao_flutter_sdk_user: ^2.0.1
  # 추천 코드 카카오톡 공유 카드(2026-10-18 사용자 승인). 로그인 부품과 같은 2.0.1 로 맞춘다.
  kakao_flutter_sdk_share: ^2.0.1
  # 애플 로그인(iOS 만, 2026-10-12 승인). nonce 해시는 위 crypto 를 같이 쓴다.
  sign_in_with_apple: ^8.2.0
  # 온보딩 입력 임시 저장(2026-10-08 승인). 전화번호 · 카카오톡 아이디는 넣지 않는다(lib/core/draft/).
  shared_preferences: ^2.5.6
  # 하트 구매(구글 플레이 인앱결제, 2026-10-13 사용자 승인). 안드로이드 구현(in_app_purchase_android)은 이 패키지가 끌고 온다.
  in_app_purchase: ^3.3.1
  # 강제 업데이트(2026-11-02): 설치된 앱의 버전 이름을 읽어 서버의 최소 버전과 견준다(lib/core/app_update/). 사용자 승인(2026-11-02 선택지 원문 「package_info_plus 추가 (추천)」), 이 패키지 하나만.
  package_info_plus: ^10.2.2
  # 움직이는 그림(Lottie, 2026-11-03 사용자 승인 「필요한 스킬 설치 및 lottie 라이브러리 ? 설치 승인할게」). 앱은 lib/common/widgets/app_lottie_view.dart 하나로만 쓴다.
  lottie: ^3.8.2
  # 화면 문구 한 곳 관리(ARB, 앱 1.0.2 B8, 2026-11-04 사용자 승인 「1 승인」). 문구 파일은 lib/l10n/app_ko.arb 하나(한국어만)이고
  # context.l10n 으로 읽는다. flutter_localizations 는 SDK 안 패키지, intl 은 이미 lock 에 있던 0.20.3 을 직접 의존성으로 올린 것.
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  # E2E 하네스(integration_test/) — 실기기에서 앱을 켜 가설을 돌린다(2026-10-04 허락, SDK 안 패키지).
  integration_test:
    sdk: flutter

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # 문구 ARB(lib/l10n/app_ko.arb) → AppLocalizations 생성. flutter pub get · flutter run 이 만든다(l10n.yaml). Flutter 3.47 부터 필수.
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    # 움직이는 그림(Lottie). 폴더 항목은 하위 폴더를 담지 않아 그림 폴더(장면마다 images/<이름>/)를 따로 적는다.
    # 새 장면을 더하면 여기에도 적는다 — test/core/theme/app_lottie_test.dart 가 빠뜨리면 알려 준다.
    - assets/lottie/
    - assets/lottie/images/splash_christmas/
    - assets/lottie/images/avatar_painting/
    - assets/lottie/images/match_celebration/

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # Pretendard 정적 4종 (400/500/600/700) — orioncactus/pretendard v1.3.9, OFL 1.1
  # (DESIGN.md §3.1, 2026-09-15 사용자 결정 — 가변 폰트 대신 정적 파일)
  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
        - asset: assets/fonts/Pretendard-Bold.otf
          weight: 700
