name: Admin Web

# 관리자 웹(admin_web/)만 본다 — 앱(frontend/) CI 와 따로 돈다(관리자 대시보드 설계서 §5 · §10).
on:
  pull_request:
    branches: [main]
    paths:
      - 'admin_web/**'
      - '.github/workflows/admin-web.yml'
  push:
    branches: [main]
    paths:
      - 'admin_web/**'
      - '.github/workflows/admin-web.yml'

# 받아서 분석 · 시험 · 빌드만 한다. Vercel 업로드는 Vercel 토큰으로 하므로 저장소 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin_web
    steps:
      - uses: actions/checkout@v5
      # 외부(제3자) 액션이라 태그 대신 커밋으로 고정한다(flutter.yml 과 같은 커밋 · 같은 Flutter).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.3
          channel: stable
      # pubspec.lock 과 다른 판을 받지 않는다(잠금 파일이 안 맞으면 실패).
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  deploy:
    needs: analyze-test
    # main 에 반영될 때만. PR 에서는 배포하지 않는다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # 비밀값(VERCEL_TOKEN · VERCEL_ORG_ID · ADMIN_SUPABASE_ANON_KEY)은 이 환경에 둔다. 배포 브랜치 제한은 GitHub 환경 설정에서 한다.
    environment: production
    # 올리는 도중 끊기지 않게 앞 실행을 취소하지 않고 줄을 세운다.
    concurrency:
      group: admin-web-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: admin_web
    # 비밀값은 잡 전체가 아니라 그 값을 쓰는 단계에만 넘긴다. 브라우저로 내려가도 되는 값만 빌드에 넣는다(anon 키 · 주소).
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.3
          channel: stable
      - run: flutter pub get --enforce-lockfile
      # 비밀 키 · service_role 키가 브라우저 번들(main.dart.js)에 구워지지 않게 빌드 전에 막는다. 값은 찍지 않는다.
      # 키가 비면 배포할 때만 실패한다 — Vercel 미설정(토큰 없음)이면 지금처럼 건너뛰고 성공. 이 단계에는 토큰 값이 아니라 있는지만 넘긴다.
      - name: 공개 키 검사
        env:
          SUPABASE_ANON_KEY: ${{ secrets.ADMIN_SUPABASE_ANON_KEY }}
          HAS_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN != '' }}
        run: |
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            if [ "$HAS_VERCEL_TOKEN" = true ]; then
              echo "::error::ADMIN_SUPABASE_ANON_KEY 값이 비어 있어 빌드하지 않았어요(GitHub 비밀값을 확인해 주세요)"
              exit 1
            fi
            echo "공개 키 없음 — Vercel 미설정이라 검사를 건너뜀"
            exit 0
          fi
          if [[ "$SUPABASE_ANON_KEY" == sb_secret_* ]]; then
            echo "::error::ADMIN_SUPABASE_ANON_KEY 에 비밀 키(sb_secret_)가 들어 있어요 — 공개 키(sb_publishable_ 또는 anon)를 넣어 주세요"
            exit 1
          fi
          # 옛 JWT 키면 가운데 토막(페이로드)의 role 을 본다. base64url → base64 로 바꾸고 '=' 채움을 붙인다.
          IFS=. read -r _ payload _ <<< "$SUPABASE_ANON_KEY"
          payload=$(printf '%s' "$payload" | tr '_-' '/+')
          while [ $(( ${#payload} % 4 )) -ne 0 ]; do payload="$payload="; done
          claims=$(printf '%s' "$payload" | base64 -d 2>/dev/null || true)
          if grep -Eq '"role" *: *"service_role"' <<< "$claims"; then
            echo "::error::ADMIN_SUPABASE_ANON_KEY 가 service_role 키예요 — anon 키를 넣어 주세요"
            exit 1
          fi
          echo "공개 키 검사 통과"
      # 값은 명령줄에 직접 쓰지 않고 환경 변수로 넘긴다(값에 따옴표 · 특수문자가 있어도 셸이 깨지지 않게).
      # --no-web-resources-cdn: CanvasKit 을 gstatic 이 아니라 우리 도메인(build/web/canvaskit)에서 받는다 — CSP 를 'self' 로 좁힌다.
      - name: 웹 빌드
        env:
          SUPABASE_URL: ${{ vars.ADMIN_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.ADMIN_SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
        run: |
          flutter build web --release --no-web-resources-cdn \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=API_BASE_URL="$API_BASE_URL"
          du -sh build/web
      # 사용자가 Vercel 을 만들기 전(토큰 없음)에도 CI 가 빨개지지 않게 건너뛰고 성공한다(설계서 §10).
      # 프로젝트 · 도메인은 Vercel REST API 로 여기서 준비한다 — Vercel 화면에서 Git 연결 · Root Directory 를 만지지 않는다.
      - name: Vercel 배포
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          SUPABASE_URL: ${{ vars.ADMIN_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.ADMIN_SUPABASE_ANON_KEY }}
          API_BASE_URL: ${{ vars.ADMIN_API_BASE_URL }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "Vercel 미설정 — 건너뜀"
            exit 0
          fi
          # 토큰은 있는데 접속 값이 비면 "설정 누락" 화면이 운영 주소를 덮는다 — 올리지 않고 실패로 알린다.
          for name in SUPABASE_URL SUPABASE_ANON_KEY API_BASE_URL VERCEL_ORG_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name 값이 비어 있어 배포하지 않았어요(GitHub 저장소 변수 · 비밀값을 확인해 주세요)"
              exit 1
            fi
          done

          # CSP(Report-Only)의 출처 자리를 실제 값으로 채운다. https://호스트[:포트] 만 받는다 — sed · CSP 를 깨는 글자가 끼지 않게.
          origin() { [[ "$1" =~ ^(https://[A-Za-z0-9.-]+(:[0-9]+)?)(/.*)?$ ]] && printf '%s' "${BASH_REMATCH[1]}"; }
          supabase_origin=$(origin "$SUPABASE_URL") || { echo "::error::SUPABASE_URL 은 https:// 로 시작하는 주소여야 해요"; exit 1; }
          api_origin=$(origin "$API_BASE_URL") || { echo "::error::API_BASE_URL 은 https:// 로 시작하는 주소여야 해요"; exit 1; }
          sed -i "s|__SUPABASE_ORIGIN__|$supabase_origin|g; s|__API_ORIGIN__|$api_origin|g" build/web/vercel.json
          if grep -q '__[A-Z_]*_ORIGIN__' build/web/vercel.json; then
            echo "::error::build/web/vercel.json 의 CSP 출처 자리를 다 채우지 못했어요"
            exit 1
          fi

          project=campusmate-admin
          domain=admin.campus-mates.com
          api=https://api.vercel.com
          team="teamId=$VERCEL_ORG_ID"
          reply="$RUNNER_TEMP/vercel-reply.json"
          # 응답 본문은 파일로만 받고 id · 상태만 꺼내 찍는다. 토큰은 헤더로만 보낸다. 출력은 HTTP 상태 코드(실패도 이어서 가른다).
          call() { curl --fail-with-body -sS -o "$reply" -w '%{http_code}' -H "Authorization: Bearer $VERCEL_TOKEN" "$@" || true; }
          failure() { echo "HTTP $1 $(jq -r '.error.code // empty' "$reply" 2>/dev/null)"; }

          # ① 프로젝트: 없으면 만든다(framework 없음 — 이미 지은 정적 파일만 올린다). 이미 있으면 409 → 이름으로 찾는다.
          code=$(call -X POST "$api/v11/projects?$team" -H 'Content-Type: application/json' \
            -d "{\"name\":\"$project\",\"framework\":null}")
          if [ "$code" = 409 ]; then
            code=$(call "$api/v9/projects/$project?$team")
          fi
          if [ "$code" != 200 ]; then
            echo "::error::Vercel 프로젝트 $project 를 준비하지 못했어요($(failure "$code"))"
            exit 1
          fi
          project_id=$(jq -r .id "$reply")
          echo "Vercel 프로젝트 $project: $project_id"

          # ② 올리기. CLI 는 VERCEL_ORG_ID · VERCEL_PROJECT_ID 환경 변수가 있으면 연결(link) 없이 그 프로젝트에 올린다.
          VERCEL_PROJECT_ID="$project_id" npx --yes vercel@64.5.0 deploy build/web --prod --yes --token "$VERCEL_TOKEN"

          # ③ 도메인: 이 프로젝트에 이미 있으면 통과, 없으면(404) 붙인다. 다른 프로젝트에 붙어 있으면 409.
          code=$(call "$api/v9/projects/$project_id/domains/$domain?$team")
          if [ "$code" = 404 ]; then
            code=$(call -X POST "$api/v10/projects/$project_id/domains?$team" -H 'Content-Type: application/json' \
              -d "{\"name\":\"$domain\"}")
          fi
          case "$code" in
            200)
              verified=$(jq -r .verified "$reply")
              echo "도메인 $domain: 이 프로젝트에 연결됨(확인됨=$verified)"
              if [ "$verified" != true ]; then
                echo "::warning::도메인 $domain 이 아직 확인 전이에요 — Vercel 의 Domains 에서 DNS 안내를 확인해 주세요"
              fi
              ;;
            409)
              echo "::error::도메인 $domain 이 다른 Vercel 프로젝트에 붙어 있거나 쓸 수 없어요($(failure "$code")) — 그 프로젝트에서 떼 주세요"
              exit 1
              ;;
            *)
              echo "::error::도메인 $domain 을 붙이지 못했어요($(failure "$code"))"
              exit 1
              ;;
          esac
