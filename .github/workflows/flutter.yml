name: Flutter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 받아서 분석 · 시험만 한다 — 쓰기 권한이 필요 없다.
permissions:
  contents: read

# PR 은 PR 마다 한 묶음이라 새 커밋이 오면 앞 실행을 멈춘다. main push 는 커밋(sha)마다 묶음이 달라 서로 기다리지도 취소되지도 않는다
# (한 묶음이면 줄 서 있던 실행이 다음 push 에 밀려 취소된다) — 커밋마다 결과가 남아야 ios-testflight.yml 의 첫 단계가 읽는다.
concurrency:
  group: flutter-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    # 보통 11분쯤 걸린다.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # 외부(제3자) 액션이라 태그 대신 커밋으로 고정한다(v2 = v2.23.0, ios-testflight.yml 과 같다).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.3
          channel: stable
      # pubspec.lock 과 다른 판을 받지 않는다(잠금 파일이 안 맞으면 실패).
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
