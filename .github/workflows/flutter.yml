name: Flutter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.3
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
