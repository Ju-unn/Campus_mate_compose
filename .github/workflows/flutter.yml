name: Flutter

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 받아서 분석 · 시험만 한다 — 쓰기 권한이 필요 없다.
permissions:
  contents: read

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      # 외부(제3자) 액션이라 태그 대신 커밋으로 고정한다(v2 = v2.23.0, ios-testflight.yml 과 같다).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: 3.47.3
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
